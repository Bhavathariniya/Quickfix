<h1>Track Your Job</h1>

<form method="GET">
    <input type="text" name="job_id" placeholder="Enter Job Card ID">
    <button type="submit">Track</button>
</form>

{% if job_id %}
    <p>Entered Job ID: {{ job_id }}</p>
{% endif %}

{% if job %}
    <h3>Job ID: {{ job_id }}</h3>
    <p>Status: {{ job.status }}</p>
    <p>Customer: {{ job.customer_name }}</p>
{% else %}
    {% if job_id %}
        <p style="color:red;">No Job Found</p>
    {% endif %}
{% endif %}
