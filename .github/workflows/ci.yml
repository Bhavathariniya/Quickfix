name: Quickfix CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-quickfix-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: "3.11"
        

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - uses: actions/checkout@v3

      # ✅ Python 3.11
      - uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python-version}}

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('/*requirements.txt', '/pyproject.toml', '/setup.py', '/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      # ✅ Fix Redis error
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Install MariaDB Client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Install Bench
        run: pip install frappe-bench

      # ✅ CRITICAL FIX HERE
      - name: Init Bench
        run: |
          bench init frappe-bench \
            --frappe-branch version-15 \
            --skip-assets \
            --python "$(which python)"

      - name: Configure DB
        run: |
          mariadb -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4';"
          mariadb -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install App
        working-directory: frappe-bench
        run: |
          bench get-app quickfix $GITHUB_WORKSPACE
          bench setup requirements --dev

          bench new-site test_site \
            --db-root-password root \
            --admin-password admin

          bench --site test_site set-config allow_tests true
          
          bench --site test_site install-app quickfix

          bench --site test_site set-config mute_emails 1
        env:
          CI: 'Yes'
      - name: Run Tests
        working-directory: frappe-bench
        run: |
          bench --site test_site --verbose run-tests --app quickfix 2>&1 | tee /tmp/test_output.log
      
      - name: upload Logs 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{matrix.python-version}}-${{github.run_id}}
          path: /tmp/test_output.log
          retention-days: 7