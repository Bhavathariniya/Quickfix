name: Quickfix CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-quickfix-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # If you have a separate test requirements file, uncomment below:
          # if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Verify Services Connectivity
        run: |
          echo "Testing MariaDB connection..."
          mariadb -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1;"
          
          echo "Testing Redis Cache connection (port 13000)..."
          redis-cli -h 127.0.0.1 -p 13000 ping
          
          echo "Testing Redis Queue connection (port 11000)..."
          redis-cli -h 127.0.0.1 -p 11000 ping

      - name: Run Tests
        run: |
          # ⚠️ REPLACE THIS LINE with your actual test command
          # Common examples:
          # pytest
          # python -m pytest
          # python manage.py test
          # tox
          echo "Running tests..."
          # python -m pytest --cov=. --cov-report=xml  # Example command
          python -c "print('Test placeholder: Replace this line with your actual test command.')"